<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Portal{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f4f7;
            color: #1f2937;
        }

        .container {
            max-width: 1220px;
            margin: 0 auto;
            padding: 32px 20px 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 58px;
            background: #172033;
            color: white;
            padding: 8px 24px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.14);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 800;
        }

        .nav {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav a {
            text-decoration: none;
            color: #e5e7eb;
            padding: 8px 10px;
            border-radius: 5px;
            font-size: 0.82rem;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav a.primary {
            background: #2563eb;
            color: white;
        }

        .nav a.secondary {
            background: transparent;
        }

        .nav .greeting {
            color: #d1d5db;
            padding: 8px 6px;
            font-size: 0.82rem;
        }

        .content {
            padding: 0 0 30px;
        }

        @media (max-width: 640px) {
            .topbar {
                align-items: flex-start;
                gap: 8px;
                flex-direction: column;
                padding: 12px 16px;
            }

            .nav {
                width: 100%;
                gap: 2px;
            }

            .nav a {
                padding: 8px;
            }

            .container {
                padding: 22px 16px 32px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'jobs:job_list' %}">Job Portal</a>
        <nav class="nav" aria-label="Main navigation">
            <a href="{% url 'jobs:job_list' %}">Home</a>
            {% if user.is_authenticated %}
                {% if user.role == 'employer' %}
                    <a href="{% url 'jobs:job_create' %}">Post a Job</a>
                    <a href="{% url 'jobs:employer_dashboard' %}">My Jobs</a>
                {% else %}
                    <a href="{% url 'jobs:seeker_dashboard' %}">My Applications</a>
                {% endif %}
                <span class="greeting">Hi, {{ user.first_name|default:user.username }}</span>
                <a href="{% url 'accounts:logout' %}" class="primary">Log Out</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="secondary">Log In</a>
                <a href="{% url 'accounts:signup' %}" class="primary">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
